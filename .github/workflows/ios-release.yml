name: iOS Release (TestFlight)

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # App Store uploads require the iOS 26 SDK or later, so pin to the newest
      # Xcode on the runner rather than whatever `xcode-select` defaults to.
      - name: Select newest Xcode
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$NEWEST" ]; then NEWEST=/Applications/Xcode.app; fi
          echo "Selecting $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write App Store Connect API key
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          echo "$APPSTORE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          # altool (unlike xcodebuild) requires the key at this conventional path.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APPSTORE_API_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"

      - name: Archive
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project NebulaForge.xcodeproj \
            -scheme NebulaForge \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/NebulaForge.xcarchive" \
            -destination "generic/platform=iOS" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID"

      - name: Export IPA
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NebulaForge.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID"

      - name: Inspect embedded entitlements of exported IPA (debug)
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          echo "IPA: $IPA"
          rm -rf "$RUNNER_TEMP/ipa_unzipped"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa_unzipped"
          PROFILE=$(find "$RUNNER_TEMP/ipa_unzipped" -name "embedded.mobileprovision" | head -1)
          if [ -n "$PROFILE" ]; then
            security cms -D -i "$PROFILE" > "$RUNNER_TEMP/exported_profile.plist"
            echo "--- Provisioning profile name ---"
            /usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/exported_profile.plist"
            echo "--- Embedded entitlements ---"
            /usr/libexec/PlistBuddy -c "Print :Entitlements" "$RUNNER_TEMP/exported_profile.plist"
          else
            echo "No embedded.mobileprovision found in exported IPA"
          fi

      - name: Upload to TestFlight
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"

      - name: Clean up API key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          rm -rf "$HOME/.appstoreconnect/private_keys"
