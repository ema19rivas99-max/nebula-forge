name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # Match the release workflow's toolchain so this build is representative.
      - name: Select newest Xcode
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$NEWEST" ]; then NEWEST=/Applications/Xcode.app; fi
          echo "Selecting $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild build \
            -project NebulaForge.xcodeproj \
            -scheme NebulaForge \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
