name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # Match the release workflow's toolchain so this build is representative.
      - name: Select newest Xcode
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$NEWEST" ]; then NEWEST=/Applications/Xcode.app; fi
          echo "Selecting $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild build \
            -project NebulaForge.xcodeproj \
            -scheme NebulaForge \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      # Tests need a concrete simulator, not the generic destination the build
      # uses. The runner's available devices change over time, so one is picked
      # at runtime rather than pinned to a name that will eventually vanish.
      - name: Pick a simulator
        id: sim
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available \
            | grep -E '^[[:space:]]*iPhone' \
            | tail -1 \
            | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            echo 'No iPhone simulator available on this runner' >&2
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project NebulaForge.xcodeproj \
            -scheme NebulaForge \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log

      # xcodebuild can report a passing exit status while individual tests
      # failed, so the log is checked for the real result too.
      - name: Verify test results
        run: |
          if grep -q "Test suite .* failed\|error: Test\|\*\* TEST FAILED \*\*" test.log; then
            echo 'Tests reported failures'
            exit 1
          fi
          grep -c "Test Case .* passed" test.log | xargs echo "passing tests:"
