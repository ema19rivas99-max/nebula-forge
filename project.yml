name: NebulaForge
options:
  bundleIdPrefix: com.nebulaforge
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
targets:
  NebulaForge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: NebulaForge.xcdatamodeld
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Nebula Forge
        CFBundleIconName: AppIcon
        # Declared explicitly so a command-line CURRENT_PROJECT_VERSION override
        # actually reaches the built Info.plist; without this the build number
        # is baked in at project-generation time and uploads collide.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSApplicationCategoryType: public.app-category.games
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
    entitlements:
      path: Sources/NebulaForge.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ema19rivas99.nebulaforge
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "862WW535F7"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Release archives are signed manually from a stored certificate and
        # profile. Automatic signing minted a throwaway Development certificate
        # on every CI run, which eventually hit Apple's per-account cap.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "NebulaForge App Store"
schemes:
  NebulaForge:
    build:
      targets:
        NebulaForge: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
    test:
      config: Debug
