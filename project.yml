name: NebulaForge
options:
  bundleIdPrefix: com.nebulaforge
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
targets:
  NebulaForge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: NebulaForge.xcdatamodeld
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Nebula Forge
        LSApplicationCategoryType: public.app-category.games
        ITSAppUsesNonExemptEncryption: false
        NSUserTrackingUsageDescription: "This identifier will be used to provide personalized ads and improve your gaming experience. You can change this at any time in Settings."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
    entitlements:
      path: Sources/NebulaForge.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nebulaforge.nebulaforge
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
